# GitLab CI equivalent of .github/workflows/pages.yml: builds the website and
# publishes it with GitLab Pages on every push to the default branch.

# Template configuration (keep in sync with .github/workflows/pages.yml)
variables:
  SKILLS_DIR: skills
  SITE_TITLE: Skill Index
  # Optional overrides; by default host and slug come from the CI platform.
  # REPO_HOST: gitlab.example.com
  # REPO_SLUG: owner/repo
  # GIT_PLATFORM: gitlab   # github | gitlab | other; controls source links
  # REPO_ACCESS: https     # https | ssh; how consumers reach this repo

pages:
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node scripts/build-site.mjs
    - mv _site public
  artifacts:
    paths:
      - public
