name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

# Template configuration (keep in sync with pages.yml)
env:
  SKILLS_DIR: skills

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build website index
        run: node scripts/build-site.mjs
