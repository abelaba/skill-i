name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Template configuration
env:
  # Repo-relative folder containing your skill directories (<name>/SKILL.md).
  SKILLS_DIR: skills
  # Heading shown on the website.
  SITE_TITLE: Skill Index
  # Optional overrides; by default host and slug come from the CI platform.
  # REPO_HOST: github.com
  # REPO_SLUG: owner/repo
  # GIT_PLATFORM: github   # github | gitlab | other; controls source links
  # REPO_ACCESS: https     # https | ssh; how consumers reach this repo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Build site
        run: uv run scripts/build-site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
