name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Template configuration
env:
  # Repo-relative folder containing your skill directories (<name>/SKILL.md).
  SKILLS_DIR: skills
  # Heading shown on the website.
  SITE_TITLE: Skill Index
  # Optional overrides; by default host and slug come from the CI platform.
  # REPO_HOST: github.com
  # REPO_SLUG: owner/repo
  # GIT_PLATFORM: github   # github | gitlab | other; controls source links
  # REPO_ACCESS: https     # https | ssh; how consumers reach this repo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
