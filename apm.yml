name: skill-index
version: 1.0.0
description: Curated index of agent skills, installable via APM and browsable on a static website.
author: aai-institute
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
- claude
dependencies:
  # External skills: reference skills that live in other repositories.
  # They are installed alongside the local skills in .apm/skills/.
  # Pin a tag or commit SHA with #<ref> to prevent drift.
  apm: []
  mcp: []
includes: auto
scripts: {}
